# budget-web: SPA + reverse proxy for the API on the same origin.
# Cloudflare Tunnel -> 127.0.0.1:8222 -> this container :8080.
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;

    # Receipt photos are uploaded through /api.
    client_max_body_size 20m;

    # Docker DNS: resolve the api container per request, so nginx starts even
    # while api is down and follows it across restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:3000;
    set $s3_upstream http://minio:9000;

    # /api/<path> -> api:3000/<path>. The API routes live at its root and its
    # refresh cookie is scoped to /auth, which becomes /api/auth here.
    location /api/ {
        include /etc/nginx/security-headers.inc;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cookie_path /auth /api/auth;
        # AI receipt parsing may take up to ~90 s
        proxy_read_timeout 120s;
    }

    # Presigned receipt photos: the API signs them for this origin
    # (S3_PUBLIC_ENDPOINT), so the path and Host reach MinIO unchanged and
    # the signature stays valid. The bucket is private; MinIO rejects
    # anything unsigned.
    location /money-accounting-ai/ {
        include /etc/nginx/security-headers.inc;
        limit_except GET { deny all; }
        proxy_pass $s3_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_hide_header Set-Cookie;
        proxy_buffering off;
    }

    # Hashed build assets never change.
    location /assets/ {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: every other path is the app.
    location / {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
